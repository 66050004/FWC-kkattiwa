<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Table</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }
        table {
            width: 100%;
            height: 100%;
            border-collapse: collapse;
            table-layout: fixed;
        }
        td {
            text-align: center;
            font-size: 2vw;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <table>
        <tr>
            <td style="background-color: #C0E4F6;">cat</td>
            <td style="background-color: #FFBBDA;">dog</td>
        </tr>
    </table>
</body>
</html>
