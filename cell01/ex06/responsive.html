<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Responsive Table</title>
<style>
    html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        width: 100%;
    }
    table {
        width: 100%;
        height: 100%;
        border-collapse: collapse;
    }
    td {
        text-align: center;
        font-size: 2vw;
        font-weight: bold;
    }
</style>
</head>
<body>
<table>
    <tr>
        <td style="background-color: #C0E4F6;">First cell</td>
        <td style="background-color: #FFBBDA;">Second cell</td>
    </tr>
</table>
</body>
