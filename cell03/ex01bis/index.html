<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Explode Balloon Bis</title>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<style>
    body { margin: 0; height: 100vh; display: flex; justify-content: center; align-items: center; background-color: #FFF5BA; }
    #balloon { width: 200px; height: 200px; background-color: red; border-radius: 50%; cursor: pointer; }
</style>
</head>
<body>
<div id="balloon"></div>
<script>
    $(document).ready(function() {
        const colors = ["red", "green", "blue"];
        let size = 200, idx = 0;
        $("#balloon").click(function() {
            size += 10; idx = (idx + 1) % colors.length;
            if (size > 420) { size = 200; idx = 0; }
            $(this).css({ width: size + "px", height: size + "px", "background-color": colors[idx] });
        });
        $("#balloon").mouseleave(function() {
            if (size > 200) {
                size -= 5; idx = (idx - 1 + colors.length) % colors.length;
                $(this).css({ width: size + "px", height: size + "px", "background-color": colors[idx] });
            }
        });
    });
</script>
</body>
</html>
