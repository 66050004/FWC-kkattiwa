<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>To do or not to do Bis</title>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<style>
    body { margin: 0; padding: 40px; background-color: #FFF5BA; font-family: Arial; display: flex; flex-direction: column; align-items: center; }
    .container { background: #fff; padding: 30px; border-radius: 20px; width: 320px; text-align: center; }
    button { padding: 10px 25px; font-weight: bold; background: #FFBBDA; border: none; border-radius: 20px; cursor: pointer; margin-bottom: 20px; }
    #ft_list { display: flex; flex-direction: column; gap: 10px; }
    #ft_list div { background: #C0E4F6; color: #4a4a4a; padding: 12px; border-radius: 12px; font-weight: bold; cursor: pointer; }
</style>
</head>
<body>
<div class="container">
    <button id="newBtn">New</button>
    <div id="ft_list"></div>
</div>
<script>
    $(document).ready(function() {
        loadToDos();
        $("#newBtn").click(function() {
            const text = prompt("Enter a new TO DO:");
            if (text && text.trim() !== "") { addToDo(text.trim()); saveToDos(); }
        });
        function addToDo(text) {
            const $todo = $("<div></div>").text(text);
            $todo.click(function() {
                if (confirm("Do you want to remove this TO DO?")) { $(this).remove(); saveToDos(); }
            });
            $("#ft_list").prepend($todo);
        }
        function saveToDos() {
            const todos = [];
            $("#ft_list div").each(function() { todos.push($(this).text()); });
            document.cookie = "todos=" + encodeURIComponent(JSON.stringify(todos)) + ";path=/;max-age=31536000";
        }
        function loadToDos() {
            const cookies = document.cookie.split(";");
            for (let c of cookies) {
                c = c.trim();
                if (c.startsWith("todos=")) {
                    try {
                        const todos = JSON.parse(decodeURIComponent(c.substring(6)));
                        todos.reverse().forEach(t => addToDo(t));
                    } catch (e) {}
                }
            }
        }
    });
</script>
</body>
</html>
