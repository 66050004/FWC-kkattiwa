<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>User Profile Card</title>
<link rel="stylesheet" href="card.css">
</head>
<body>

<div class="card">
    <div class="card-header">User Profile Card</div>
    <table>
        <tr>
            <td>
                <img src="https://picsum.photos/200" alt="Profile Picture" class="profile-img">
            </td>
        </tr>
        <tr>
            <td>
                <p class="login">kkattiwa</p>
                <p class="description">42 Piscine Student ✨</p>
            </td>
        </tr>
        <tr>
            <td class="social-icons">
                <a href="#"><img src="https://cdn-icons-png.flaticon.com/512/733/733579.png" alt="Twitter"></a>
                <a href="#"><img src="https://cdn-icons-png.flaticon.com/512/3536/3536505.png" alt="LinkedIn"></a>
                <a href="#"><img src="https://cdn-icons-png.flaticon.com/512/733/733547.png" alt="Facebook"></a>
            </td>
        </tr>
        <tr>
            <td>
                <button class="contact-btn">Contact</button>
            </td>
        </tr>
    </table>
</div>

</body>
</html>
